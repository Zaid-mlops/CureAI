version: '3.8'

services:
  # Model runtime (Ollama). Replace image with your chosen model runtime if different.
  model:
    image: ollama/ollama:latest
    # If Ollama requires persistent storage or model mounts, add volumes here.
    ports:
      - "11434:11434"
    restart: unless-stopped

  web:
    build: .
    environment:
      - OLLAMA_URL=http://model:11434/api/generate
      - FLASK_RUN_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - model
    restart: unless-stopped

  # Optional: nginx reverse proxy for public exposure. Use only if exposing publicly.
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
